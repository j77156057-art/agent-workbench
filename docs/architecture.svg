<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="100%" role="img" font-family="Microsoft YaHei, PingFang SC, Segoe UI, Helvetica, Arial, sans-serif">
<title>Agent 工作台 · 六层架构</title>
<desc>Agent 工作台 的 Agent 运行时按六层组织：E 执行循环、T 工具注册、C 上下文管理、S 状态存储、L 生命周期钩子、V 评估接口，配合架构范式 P。</desc>

<rect x="20" y="20" width="640" height="660" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="40" y="52" font-size="15" font-weight="500" fill="#2C2C2A">Agent 工作台 · Agent Harness 六层架构</text>
<text x="40" y="74" font-size="11" fill="#5F5E5A">H = (E, T, C, S, L, V) + P　｜　47 个工具 · 1131 项自动化测试全绿 · 零 API Key 可离线运行</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#D3D1C7" stroke-width="0.5"/>

<rect x="40" y="100" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="116" width="4" height="40" rx="2" fill="#185FA5"/>
<rect x="56" y="120" width="32" height="32" rx="8" fill="#185FA5"/>
<text x="72" y="136" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">E</text>
<text x="100" y="126" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">执行循环</text>
<text x="100" y="150" font-size="11" fill="#5F5E5A" dominant-baseline="central">agent.py · orchestrator.py</text>
<text x="290" y="126" font-size="11" fill="#2C2C2A" dominant-baseline="central">ReAct + 反思重试 · 原生 function-calling</text>
<text x="290" y="150" font-size="11" fill="#2C2C2A" dominant-baseline="central">plan 模式 · 子代理委派 · 并行只读批次</text>

<rect x="40" y="179" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="195" width="4" height="40" rx="2" fill="#185FA5"/>
<rect x="56" y="199" width="32" height="32" rx="8" fill="#185FA5"/>
<text x="72" y="215" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">T</text>
<text x="100" y="205" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">工具注册</text>
<text x="100" y="229" font-size="11" fill="#5F5E5A" dominant-baseline="central">tools.py</text>
<text x="290" y="205" font-size="11" fill="#2C2C2A" dominant-baseline="central">47 个工具统一注册与派发 · 参数校验</text>
<text x="290" y="229" font-size="11" fill="#2C2C2A" dominant-baseline="central">域名白名单 · 受控写四护栏（含人工确认）</text>

<rect x="40" y="258" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="274" width="4" height="40" rx="2" fill="#185FA5"/>
<rect x="56" y="278" width="32" height="32" rx="8" fill="#185FA5"/>
<text x="72" y="294" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">C</text>
<text x="100" y="284" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">上下文管理</text>
<text x="100" y="308" font-size="11" fill="#5F5E5A" dominant-baseline="central">agent.py · _fit_budget</text>
<text x="290" y="284" font-size="11" fill="#2C2C2A" dominant-baseline="central">prompt token 预算 / 观察截断 / 轨迹裁剪</text>
<text x="290" y="308" font-size="11" fill="#2C2C2A" dominant-baseline="central">历史滚动摘要 · token 计数 O(N) 压到 1 次</text>

<rect x="40" y="337" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="353" width="4" height="40" rx="2" fill="#185FA5"/>
<rect x="56" y="357" width="32" height="32" rx="8" fill="#185FA5"/>
<text x="72" y="373" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">S</text>
<text x="100" y="363" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">状态存储</text>
<text x="100" y="387" font-size="11" fill="#5F5E5A" dominant-baseline="central">agent_trace.py · sessions.py</text>
<text x="290" y="363" font-size="11" fill="#2C2C2A" dominant-baseline="central">逐轮 trace 账本（只记元数据不记正文）</text>
<text x="290" y="387" font-size="11" fill="#2C2C2A" dominant-baseline="central">会话隔离持久化 · 跨重启恢复 · 变更集回滚</text>

<rect x="40" y="416" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="432" width="4" height="40" rx="2" fill="#185FA5"/>
<rect x="56" y="436" width="32" height="32" rx="8" fill="#185FA5"/>
<text x="72" y="452" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">L</text>
<text x="100" y="442" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">生命周期钩子</text>
<text x="100" y="466" font-size="11" fill="#5F5E5A" dominant-baseline="central">hooks.py · skills.py</text>
<text x="290" y="442" font-size="11" fill="#2C2C2A" dominant-baseline="central">工具 / 回合钩子与技能热插拔</text>
<text x="290" y="466" font-size="11" fill="#2C2C2A" dominant-baseline="central">人工审批门 · 按 provider 计价与成本熔断</text>

<rect x="40" y="495" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="511" width="4" height="40" rx="2" fill="#185FA5"/>
<rect x="56" y="515" width="32" height="32" rx="8" fill="#185FA5"/>
<text x="72" y="531" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">V</text>
<text x="100" y="521" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">评估接口</text>
<text x="100" y="545" font-size="11" fill="#5F5E5A" dominant-baseline="central">agent_eval.py · run_golden.py</text>
<text x="290" y="521" font-size="11" fill="#2C2C2A" dominant-baseline="central">黄金题 40 题（单跳 / 多跳 / 抗干扰）</text>
<text x="290" y="545" font-size="11" fill="#2C2C2A" dominant-baseline="central">反幻觉黑名单 · must_call 校验 · 回归门</text>

<line x1="40" y1="579" x2="640" y2="579" stroke="#D3D1C7" stroke-width="0.5"/>

<circle cx="45" cy="600" r="3" fill="#185FA5"/>
<text x="58" y="600" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">P 架构范式</text>
<text x="150" y="600" font-size="11" fill="#2C2C2A" dominant-baseline="central">扩展 嵌入式 · 配置 命令式 · 部署 单机 · 编排 中心化</text>

<circle cx="45" cy="626" r="3" fill="#185FA5"/>
<text x="58" y="626" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">三条设计取向</text>
<text x="150" y="626" font-size="11" fill="#2C2C2A" dominant-baseline="central">护栏复用（不另开执行语义）· 全链路有界 · 不越权</text>

<circle cx="45" cy="652" r="3" fill="#185FA5"/>
<text x="58" y="652" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">上层落地</text>
<text x="150" y="652" font-size="11" fill="#2C2C2A" dominant-baseline="central">本地工程工作台：代码问答 · 受控改写 · 场景画布</text>

</svg>
