<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- 字体已全部自托管，见 src/fonts.ts —— 不再依赖任何外部字体 CDN -->
    <title>DocMind · 代码工作台</title>
    <!-- 首帧与 memory-inspector-tokens.css 的 --mi-bg-deep 保持一致，避免模块下载前闪白。 -->
    <script>
      (function () {
        var el = document.documentElement
        el.setAttribute('data-skin', 'observatory')
        el.style.colorScheme = 'dark'
        el.style.background = 'oklch(0.145 0.018 245)'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/static/session.js"></script>
    <script type="module" src="/src/workbench/main.ts"></script>
  </body>
</html>
