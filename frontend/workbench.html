<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- 字体已全部自托管，见 src/fonts.ts —— 不再依赖任何外部字体 CDN -->
    <title>DocMind · 代码工作台</title>
    <!-- 首帧配色：与 src/workbench/palette.ts 同源同默认（墨屿纸感）。深色偏好在这里就应用，
         避免模块下载前先闪一下白，也避免旧版本「强制观测舱」的首帧硬编码。 -->
    <script>
      (function () {
        var el = document.documentElement
        var key = 'moyu'
        try { key = window.localStorage.getItem('docmind.workbenchPalette') || 'moyu' } catch (e) {}
        var skin = key === 'observatory' ? 'observatory'
          : key === 'moyu' ? 'moyu'
          : key === 'moyu-night' ? 'moyu-night'
          : ''
        var dark = key === 'observatory' || key === 'moyu-night'
        if (skin) el.setAttribute('data-skin', skin)
        el.style.colorScheme = dark ? 'dark' : 'light'
        el.style.background = key === 'moyu' ? 'oklch(0.945 0.011 78)'
          : key === 'moyu-night' ? 'oklch(0.142 0.008 60)'
          : dark ? 'oklch(0.145 0.018 245)' : 'oklch(0.952 0.004 245)'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/static/session.js"></script>
    <script type="module" src="/src/workbench/main.ts"></script>
  </body>
</html>
