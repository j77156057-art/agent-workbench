name: Harness Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.backend }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            checkpoint_dsn: ""
          - backend: postgres
            checkpoint_dsn: postgresql://docmind:docmind@localhost:5432/docmind
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U docmind -d docmind"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DOCMIND_CHECKPOINT_POSTGRES_DSN: ${{ matrix.checkpoint_dsn }}
      DOCMIND_CHECKPOINT_POSTGRES_REQUIRED: "0"
      DOCMIND_WORKFLOW_AUTO_RECOVER: "0"
      DOCMIND_TRACE: "0"
      DOCMIND_LIVE_RETRIEVAL_COLLECTION: ${{ vars.DOCMIND_LIVE_RETRIEVAL_COLLECTION || '' }}
      DOCMIND_REAL_GAME_PROJECT: ${{ vars.DOCMIND_REAL_GAME_PROJECT || '' }}
      DOCMIND_GODOT_EXECUTABLE: ${{ vars.DOCMIND_GODOT_EXECUTABLE || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        if: matrix.backend == 'sqlite'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build workbench frontend
        if: matrix.backend == 'sqlite'
        working-directory: frontend
        # `--ignore-scripts` 与 dependency_bootstrap.py 那条同步路径保持一致。
        # 实测依据（产物逐字节相同）：docs/harness-research-verified.md §1.4；
        # 守卫 tests/test_npm_ignore_scripts_pinned.py 会同时钉住这两处。
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run frontend behaviour tests (node:test)
        if: matrix.backend == 'sqlite'
        working-directory: frontend
        # 这些用例早就存在但一直没人跑（package.json 里没有 test 入口）。计数级的
        # 「声明了多少 vs 真跑了多少」判定在 tests/test_frontend_node_tests.py 里，
        # 会随 pytest lane 一起跑——这里只负责人类可读的那份日志。
        run: npm run test:node
      - name: Compile runtime
        run: python -m compileall -q agent_runtime api_routes
      - name: Verify Postgres driver and pool API
        if: matrix.backend == 'postgres'
        run: |
          python -c "import inspect, psycopg, psycopg_pool; print(psycopg.__version__); print(inspect.signature(psycopg_pool.ConnectionPool))"
      - name: Run workflow regression gate
        run: python -m agent_runtime.workflow_eval --self-check --baseline .github/workflow-eval-baseline.json --json
      - name: Run dev lane capability gate
        run: python -m agent_runtime.dev_eval --self-check --baseline .github/dev-eval-baseline.json --json
      - name: Run mutation batteries (守卫到底有没有牙)
        if: matrix.backend == 'sqlite'
        # 上面那道门只问"能力在不在"，这一道问"守着能力的测试会不会根本没在守"：
        # 逐条把源码改坏，确认有测试或门禁因此变红。--no-live = 不启真浏览器，
        # 只有现场能验的变异记成「本环境未验证」而不是"抓住"。
        run: python tests/mutation/run_all.py --no-live -q
      - name: Run retrieval regression gate
        run: python -m agent_runtime.retrieval_eval --dataset .github/retrieval-eval.json --baseline .github/retrieval-eval-baseline.json --minimum 0.75 --json
      - name: Run live Chroma retrieval gate
        if: env.DOCMIND_LIVE_RETRIEVAL_COLLECTION != ''
        env:
          DOCMIND_NO_TEST_ISOLATION: "1"
        run: |
          python -m agent_runtime.retrieval_eval \
            --live-cases .github/retrieval-eval-live.json \
            --collection "$DOCMIND_LIVE_RETRIEVAL_COLLECTION" \
            --modes dense,hybrid,hybrid_rerank \
            --baseline .github/retrieval-eval-live-baseline.json \
            --minimum 0.75 --json
      - name: Run offline game workflow acceptance
        run: python -m unittest tests.test_game_workflow_e2e tests.test_retrieval_adapter tests.test_retrieval_api -q
      - name: Run opt-in real project acceptance
        if: env.DOCMIND_REAL_GAME_PROJECT != '' && env.DOCMIND_GODOT_EXECUTABLE != ''
        env:
          DOCMIND_NO_TEST_ISOLATION: "1"
        run: |
          python -m agent_runtime.acceptance \
            --project "$DOCMIND_REAL_GAME_PROJECT" \
            --godot "$DOCMIND_GODOT_EXECUTABLE" \
            --json > real-acceptance.json
          python -c "import json; p=json.load(open('real-acceptance.json', encoding='utf-8')); assert p.get('ok') and p.get('source_unchanged'), p"
      - name: Restart Postgres service before integration checks
        if: matrix.backend == 'postgres'
        run: |
          container_id=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)
          test -n "$container_id"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U docmind -d docmind >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run pytest-style lane
        if: matrix.backend == 'sqlite'
        # unittest collects TestCase classes only, so files whose tests are
        # module-level `def test_*` functions never reach the step below.
        run: |
          files=$(python - <<'PY'
          import ast, pathlib
          paths = []
          for p in sorted(pathlib.Path("tests").glob("test_*.py")):
              tree = ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              if any(isinstance(n, ast.FunctionDef) and n.name.startswith("test_") for n in tree.body):
                  paths.append(p.as_posix())
          print(" ".join(paths))
          PY
          )
          test -n "$files"
          python -m pytest $files -q -p no:cacheprovider
      - name: Run full test suite
        if: matrix.backend == 'sqlite'
        env:
          DOCMIND_TRACE: "1"
        run: python -m unittest discover -s tests -p "test*.py" -q
      - name: Verify strict Postgres integration
        if: matrix.backend == 'postgres'
        env:
          DOCMIND_TEST_POSTGRES_DSN: ${{ matrix.checkpoint_dsn }}
          DOCMIND_CHECKPOINT_POSTGRES_REQUIRED: "1"
        run: python -m unittest tests.test_postgres_workflow_integration -q
      - name: LangSmith live metadata smoke test
        if: matrix.backend == 'sqlite'
        env:
          DOCMIND_LANGSMITH_LIVE: "1"
          DOCMIND_LANGSMITH: "1"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT || 'docmind-ci' }}
        run: |
          if [ -n "$LANGCHAIN_API_KEY" ]; then
            python -m unittest tests.test_langsmith_live -q
          else
            echo "LANGCHAIN_API_KEY is not configured; live smoke test skipped"
          fi
      - name: Live LLM workflow contract smoke test
        if: matrix.backend == 'sqlite' && vars.DOCMIND_LLM_LIVE == '1'
        env:
          DOCMIND_LLM_LIVE: "1"
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mock' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m unittest tests.test_live_llm_workflow -q
