name: Harness Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.backend }} tests (${{ matrix.shard }}/${{ matrix.shards }})
    # 钉死而不是 `ubuntu-latest`：2026-11-02 实测 latest 仍解析到 `Image: ubuntu-24.04`
    # （run 41398743596 的 Set up job 日志），但注解同时预告了「beginning October 19, 2026
    # 迁到 Ubuntu 26」。标签一飘，浏览器/沙箱/AppArmor 的行为跟着变，而红名单只会告诉我们
    # 「测试红了」，不会告诉我们原因是镜像。守卫：tests/test_ci_runner_and_action_pins.py
    runs-on: ubuntu-24.04
    # 没有超时的 job 会一路挂到 GitHub 默认的 6 小时：一次死锁的浏览器启动就把
    # runner 占满，红名单也出不来。分片后单 shard 的正常耗时实测约 10–15 分钟。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # sqlite 全量套件按文件分 4 片并行（2026-11-17）：串行 ~25 分钟的大头是
          # unittest 全量；分片后每片只跑 1/4 的文件，墙钟 ≈ 装环境 + 套件/4。
          # 分片算法两步一致：按**文件名稳定哈希** crc32(name)%shards（确定性、跨平台、
          # 不随提交体积变化挪位，各片独立算出同一份全局分配再取自己那份）。
          # 覆盖率数据每片上传，coverage-gate job 合并后过门。守卫：tests/test_ci_shard_lane.py
          - backend: sqlite
            checkpoint_dsn: ""
            shard: 1
            shards: 4
          - backend: sqlite
            checkpoint_dsn: ""
            shard: 2
            shards: 4
          - backend: sqlite
            checkpoint_dsn: ""
            shard: 3
            shards: 4
          - backend: sqlite
            checkpoint_dsn: ""
            shard: 4
            shards: 4
          - backend: postgres
            checkpoint_dsn: postgresql://docmind:docmind@localhost:5432/docmind
            shard: 1
            shards: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U docmind -d docmind"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DOCMIND_CHECKPOINT_POSTGRES_DSN: ${{ matrix.checkpoint_dsn }}
      DOCMIND_CHECKPOINT_POSTGRES_REQUIRED: "0"
      DOCMIND_WORKFLOW_AUTO_RECOVER: "0"
      DOCMIND_TRACE: "0"
      DOCMIND_LIVE_RETRIEVAL_COLLECTION: ${{ vars.DOCMIND_LIVE_RETRIEVAL_COLLECTION || '' }}
      DOCMIND_REAL_GAME_PROJECT: ${{ vars.DOCMIND_REAL_GAME_PROJECT || '' }}
      DOCMIND_GODOT_EXECUTABLE: ${{ vars.DOCMIND_GODOT_EXECUTABLE || '' }}
      # Chromium 系的用户命名空间沙箱在带 AppArmor 的 Ubuntu 24.04 上会被拒，
      # 浏览器于是**一起身就退**，而 stderr 默认被丢进 DEVNULL —— 只剩一句
      # 「调试端口未就绪」。这个开关关掉的是浏览器自己的安全边界，所以只在 CI
      # 里开（Linux 桌面端默认不开），且只作用于一次性 runner。
      DOCMIND_BROWSER_NO_SANDBOX: "1"
    steps:
      # 三个动作都要 node24 的大版本：v4/v5/v4 的 `action.yml` 仍写着 `using: node20`，
      # 于是每次跑都吃一条「Node.js 20 is deprecated … forced to run on Node.js 24」告警。
      # 逐 tag 读 action.yml 得到的分界线：checkout v5 起、setup-python v6 起、setup-node v5 起
      # 才是 node24；这一批要求的 runner 版本 v2.327.1，托管 runner 实测 2.338.2 —— 够用。
      - uses: actions/checkout@v7
        # 改动行覆盖率门要 `git diff <base>..HEAD`，默认浅克隆只有 1 个提交，
        # 取不到 base 会让门 fail-closed 变成恒红（见 agent_runtime/coverage_eval）。
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        if: matrix.backend == 'sqlite'
        with:
          # node 24 自带的 npm 11.x 才认得出 frontend/.npmrc 的 `min-release-age`
          # （需 npm >= 11.6.0）。node 22 自带 npm 10.9.x —— 那个键会被静默忽略，
          # 于是本仓库唯一的 npm 侧供应链防护在 CI 里一直是**哑的**。
          # 守卫：tests/test_min_release_age_pinned.py::test_the_npm_version_supports_it
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # 默认清单不再包含 sentence-transformers（已移到 requirements-ml.txt），
        # 因此 CI 不会解析出 torch / transformers / scipy / sympy，也不需要再从
        # PyTorch CPU 索引预装 torch。
        # 背景（实测）：拆开前 s-t 会连带拉 PyPI 的 torch，linux 上再拖
        # `nvidia-*-cu13` + `triton` + `cudnn`，一次安装 3.27 GB / 2 分 12 秒；
        # run 41411405586 的 sqlite lane 就死在 `No space left on device`。
        # 现在这条 lane 只装默认依赖；`cross_encoder` 重排不在 CI 的验证范围内。
        # 守卫：tests/test_ci_cpu_only_torch.py（清单形状、退出码没被吞、邻门仍在）。
        run: |
          python -m pip install -r requirements.txt
      - name: Build workbench frontend
        if: matrix.backend == 'sqlite'
        working-directory: frontend
        # `--ignore-scripts` 与 dependency_bootstrap.py 那条同步路径保持一致。
        # 实测依据（产物逐字节相同）：tools/mutation/probe_npm_ignore_scripts.py；
        # 守卫 tests/test_npm_ignore_scripts_pinned.py 会同时钉住这两处。
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run frontend behaviour tests (node:test)
        if: matrix.backend == 'sqlite'
        working-directory: frontend
        # 这些用例早就存在但一直没人跑（package.json 里没有 test 入口）。计数级的
        # 「声明了多少 vs 真跑了多少」判定在 tests/test_frontend_node_tests.py 里，
        # 会随 pytest lane 一起跑——这里只负责人类可读的那份日志。
        run: npm run test:node
      - name: Privacy gate (machine paths / real session ids / key shapes)
        if: matrix.backend == 'sqlite'
        # 2026-11-17 挂门：基线假化曾靠手工替换漏过 dev-* 会话 id。
        # 豁免（夹具约定路径/假键/全零占位）逐条计数打印，不静默。
        run: python tools/privacy_scan.py
      - name: Doc reference gate (tracked paths + line ranges)
        if: matrix.backend == 'sqlite'
        # 判据是 git 跟踪而非本机存在：被 gitignore 的内部文档在本机判绿、
        # 空白克隆上就是死链（2026-11-17 实测漏过两处后收窄）。
        run: python tools/check_docs_refs.py
      - name: Lint workbench frontend (eslint)
        if: matrix.backend == 'sqlite'
        working-directory: frontend
        # eslint 早就装了、flat config 也配好了，agent 的 `dev_diagnostics` 也会按需跑它
        # （`diagnostics.LINT_GATES = True`），**但 CI 从没跑过** —— 于是改前端时没人吹哨，
        # 红只会在某个恰好去诊断的时刻冒出来。第一次以 CI 口径跑就抓到一处躺在仓库里的
        # 真实缺陷：ChatDock.vue 切项目时 `sid` 赋值后再没被读（死赋值）。
        # 守卫 tests/test_ci_lint_gate.py 钉住「步骤在、跑在 npm ci 之后、退出码没被吞」。
        run: npm run lint
      - name: Compile runtime
        run: python -m compileall -q agent_runtime api_routes
      - name: Static defect gate (ruff F821/F811/F402/F541/F841/F401/W605/SIM115)
        # 放的是**真缺陷类**八条：F821 未定义名、F811 重复定义且旧值没被用、F402 循环变量
        # 遮蔽了导入、F541 f-string 根本没有占位符、F841 赋值后没人读、F401 未用 import、
        # W605 非法转义序列、SIM115 文件打开后没用上下文管理（句柄靠 gc 关）。
        # 不放开整组 `F` —— 实测量过本仓库 `--select F` 有 195 条，裸接进 CI 的第一天就是
        # 195 行噪声，比没有门更坏：它让人误以为有人在管。判据是**只增不减**：
        # F541(4)+F841(50) 于 2026-11-02 清零后放入；F401 同批清掉 119 条后放入，
        # 剩下 10 条是**带证据的豁免**（再导出 / 走模块对象取名字 / `ctx.engine_start`
        # 这类静态扫描看不见的动态取用），拆成独立语句逐行标 noqa 豁免，
        # 绝不用一行 noqa 顺手豁免同行的真死导入。
        # W605 是 2026-11-02 从**改动行覆盖率门自己的日志**里挖出来的：`coverage json` 在
        # 解析源码时把 `SyntaxWarning: invalid escape sequence '\S'` 打了出来 —— Python 3.12
        # 只是警告，往后就是 SyntaxError。实测全仓 2 条，清零后放入。
        # SIM115 同一天从**本机全量的 ResourceWarning** 里挖出来：129 条 `unclosed file`
        # 的静态对应物。实测全仓 90 处（生产代码 23 / tools 脚本 6 / 测试 61），清零后放入 ——
        # 剩下 3 处是**带证据的豁免**（引擎日志句柄活到 engine_stop、两处锁句柄本身就是被测对象），
        # 逐行标 noqa 并写明关闭点。判据仍是只增不减。
        # 接这道门当天它抓到 3 条活的缺陷：`app_test.py` 把 `Mapping` 只写进注解却没 import，
        # 文件有 `from __future__ import annotations` 所以导入不炸，但
        # `typing.get_type_hints(server_env)` 实测抛 `NameError`。
        # 守卫 tests/test_ci_static_defect_gate.py —— 规则集从本文件读、并当场真跑一次。
        run: python -m ruff check --select F821,F811,F402,F541,F841,F401,W605,SIM115 .
      - name: Verify Postgres driver and pool API
        if: matrix.backend == 'postgres'
        run: |
          python -c "import inspect, psycopg, psycopg_pool; print(psycopg.__version__); print(inspect.signature(psycopg_pool.ConnectionPool))"
      - name: Run live Chroma retrieval gate
        if: env.DOCMIND_LIVE_RETRIEVAL_COLLECTION != ''
        env:
          DOCMIND_NO_TEST_ISOLATION: "1"
        run: |
          python -m agent_runtime.retrieval_eval \
            --live-cases .github/retrieval-eval-live.json \
            --collection "$DOCMIND_LIVE_RETRIEVAL_COLLECTION" \
            --modes dense,hybrid,hybrid_rerank \
            --baseline .github/retrieval-eval-live-baseline.json \
            --minimum 0.75 --json
      - name: Run opt-in real project acceptance
        if: env.DOCMIND_REAL_GAME_PROJECT != '' && env.DOCMIND_GODOT_EXECUTABLE != ''
        env:
          DOCMIND_NO_TEST_ISOLATION: "1"
        run: |
          python -m agent_runtime.acceptance \
            --project "$DOCMIND_REAL_GAME_PROJECT" \
            --godot "$DOCMIND_GODOT_EXECUTABLE" \
            --json > real-acceptance.json
          python -c "import json; p=json.load(open('real-acceptance.json', encoding='utf-8')); assert p.get('ok') and p.get('source_unchanged'), p"
      - name: Restart Postgres service before integration checks
        if: matrix.backend == 'postgres'
        run: |
          container_id=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)
          test -n "$container_id"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U docmind -d docmind >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run pytest-style lane
        if: matrix.backend == 'sqlite'
        env:
          CI_SHARD: ${{ matrix.shard }}
          CI_SHARDS: ${{ matrix.shards }}
        # unittest collects TestCase classes only, so files whose tests are
        # module-level `def test_*` functions never reach the step below.
        #
        # 两个 lane 都把输出落盘再过一遍 `tools/ci_red_summary.py`：
        # 原始日志的下载域名（objects.githubusercontent.com）在开发机上不可达，
        # 而它打出的 `::error` 注释挂在 check-run 上，`gh api .../annotations`
        # 走 api.github.com 就能读到红名单。分片后每片各自打自己的红名单。
        run: |
          files=$(python - <<'PY'
          import ast, os, pathlib, zlib
          shard, total = int(os.environ["CI_SHARD"]), int(os.environ["CI_SHARDS"])
          paths = []
          for p in sorted(pathlib.Path("tests").glob("test_*.py")):
              tree = ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              if any(isinstance(n, ast.FunctionDef) and n.name.startswith("test_") for n in tree.body):
                  paths.append(p)
          mine = [p.as_posix() for p in paths
                  if zlib.crc32(p.name.encode("utf-8")) % total == shard - 1]
          print(" ".join(mine))
          PY
          )
          test -n "$files"
          set +e   # 同上：默认 -e 会让 pytest 一失败就跳过红名单
          mkdir -p .tmp/ci-cov
          # 同一趟测试顺便量覆盖率（`coverage run -m pytest`，不是再跑一遍测试）：
          # 实测这样只贵 ~17%（plain 29s → 34s），比重复跑一条 lane 省一倍时间。
          python -m coverage run --data-file=.tmp/ci-cov/.coverage.pytest --source=. \
            -m pytest $files -q -p no:cacheprovider > /tmp/pytest-lane.log 2>&1
          rc=$?
          cat /tmp/pytest-lane.log
          python tools/ci_red_summary.py /tmp/pytest-lane.log || true
          exit $rc
      - name: Browser preflight
        if: matrix.backend == 'sqlite'
        # 浏览器是真能力，不是「现场层」：它起不来时，后面 37 条用例会以 5 种
        # 不同形状报红（端口未就绪 / KeyError:'failed' / KeyError:'pattern' /
        # FileNotFoundError / 拿不到 page id），看不出是同一件事。
        # 这里先起一次并把 stderr 打出来 —— 起不来就是**一条**清楚的报错。
        run: |
          # Chromium 需要 libXtst.so.6。runner 镜像的 install-google-chrome.sh
          # 装了它，install-microsoft-edge.sh 用 --no-install-recommends 没装 ——
          # 缺这个库时浏览器一起身就退，报错形状与「沙箱被拒」一模一样。
          if ! ldconfig -p 2>/dev/null | grep -q libXtst; then
            echo "libXtst missing; installing libxtst6"
            sudo apt-get update -qq && sudo apt-get install -y -qq libxtst6
          fi
          echo "--- 候选浏览器 ---"
          for bin in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge msedge; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "found: $bin -> $(command -v "$bin")"
              "$bin" --version || true
            fi
          done
          echo "--- 真起一次（走生产路径 browser_session）---"
          python - <<'PY'
          from agent_runtime import visual_acceptance as visual
          ok = visual.browser_available(timeout=30)
          print("browser_available =", ok)
          print("reason =", visual.browser_probe_reason())
          raise SystemExit(0 if ok else 1)
          PY
      - name: Run full test suite
        if: matrix.backend == 'sqlite'
        env:
          DOCMIND_TRACE: "1"
          CI_SHARD: ${{ matrix.shard }}
          CI_SHARDS: ${{ matrix.shards }}
        # 分片跑全量：按**文件名稳定哈希** crc32(name)%shards 分片（与 pytest lane 同一算法），
        # 本片只把自己那份模块名交给 `python -m unittest`。TestCase 收集口径与
        # discover 相同（模块级 pytest 函数不被 unittest 收取，归 pytest lane）。
        # 用稳定哈希而非体积：体积随每次提交变化会让分片挪位、反复暴露潜伏的跨测试
        # 依赖；文件名不变 → 分配恒定，隔离修复一次到位即永久绿（跨平台也一致）。
        run: |
          modules=$(python - <<'PY'
          import os, pathlib, zlib
          shard, total = int(os.environ["CI_SHARD"]), int(os.environ["CI_SHARDS"])
          files = pathlib.Path("tests").glob("test*.py")
          mine = ["tests." + p.stem for p in files
                  if zlib.crc32(p.name.encode("utf-8")) % total == shard - 1]
          print(" ".join(mine))
          PY
          )
          test -n "$modules"
          set +e   # run: 默认 bash -e，测试一失败脚本就退出，后面的红名单永远不会执行
          mkdir -p .tmp/ci-cov
          python -m coverage run --data-file=.tmp/ci-cov/.coverage.unittest --source=. \
            -m unittest $modules -q > /tmp/unittest.log 2>&1
          rc=$?
          cat /tmp/unittest.log
          python tools/ci_red_summary.py /tmp/unittest.log || true
          exit $rc
      - name: Upload shard coverage data
        if: matrix.backend == 'sqlite' && always()
        # 每片的覆盖率数据带片号上传（同名文件会在合并下载时互相覆盖），
        # coverage-gate job 收齐 4 片后 combine 再过改动行门。红片也传：
        # 失败现场的数据同样有诊断价值。
        run: |
          mkdir -p .tmp/ci-cov-upload
          for f in .tmp/ci-cov/.coverage.pytest .tmp/ci-cov/.coverage.unittest; do
            if [ -f "$f" ]; then
              cp "$f" ".tmp/ci-cov-upload/$(basename "$f").shard-${{ matrix.shard }}"
            fi
          done
      - name: Publish coverage artifact (shard ${{ matrix.shard }})
        if: matrix.backend == 'sqlite' && always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-cov-shard-${{ matrix.shard }}
          path: .tmp/ci-cov-upload/
          retention-days: 1
          if-no-files-found: error
          # 覆盖率数据文件以 . 开头（.coverage.*），upload-artifact v7 默认
          # include-hidden-files:false 会把它们整个漏掉 → 「No files were found」。
          # 必须显式收隐藏文件；coverage combine 认的就是 .coverage.* 命名。
          include-hidden-files: true
      - name: Verify strict Postgres integration
        if: matrix.backend == 'postgres'
        env:
          DOCMIND_TEST_POSTGRES_DSN: ${{ matrix.checkpoint_dsn }}
          DOCMIND_CHECKPOINT_POSTGRES_REQUIRED: "1"
        run: python -m unittest tests.test_postgres_workflow_integration -q
      - name: LangSmith live metadata smoke test
        if: matrix.backend == 'sqlite'
        env:
          DOCMIND_LANGSMITH_LIVE: "1"
          DOCMIND_LANGSMITH: "1"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT || 'docmind-ci' }}
        run: |
          if [ -n "$LANGCHAIN_API_KEY" ]; then
            python -m unittest tests.test_langsmith_live -q
          else
            echo "LANGCHAIN_API_KEY is not configured; live smoke test skipped"
          fi
      - name: Live LLM workflow contract smoke test
        if: matrix.backend == 'sqlite' && vars.DOCMIND_LLM_LIVE == '1'
        env:
          DOCMIND_LLM_LIVE: "1"
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mock' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m unittest tests.test_live_llm_workflow -q

  # 能力门 + 变异电池（2026-11-17 从 test 矩阵拆出，只跑一次）：workflow/dev/retrieval
  # 评测与变异电池是**全仓口径**的门，与测试分片无关。原先挂在 test job 上会在 4 个
  # sqlite 分片里各跑一遍（变异电池 ~4min × 4），既浪费 CI 分钟又把最慢分片拖长。
  # 拆成独立并行 job 后只跑一次，test 分片专心跑测试，墙钟进一步下降。
  # 这些门不被「按步骤钉在 test job」的接线守卫约束（守卫钉的是 ruff/lint/隐私/覆盖率等），
  # 搬出来后仍每次推送必跑、红则整条 workflow 红——牙口不减。守卫：tests/test_ci_shard_lane.py。
  capability-gates:
    name: capability gates + mutation (once)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCMIND_CHECKPOINT_POSTGRES_REQUIRED: "0"
      DOCMIND_WORKFLOW_AUTO_RECOVER: "0"
      DOCMIND_TRACE: "0"
      DOCMIND_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build workbench frontend
        working-directory: frontend
        # 变异电池含前端守卫（eslint/产物形状），需要 node_modules 与构建产物。
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run workflow regression gate
        run: python -m agent_runtime.workflow_eval --self-check --baseline .github/workflow-eval-baseline.json --json
      - name: Run dev lane capability gate
        run: python -m agent_runtime.dev_eval --self-check --baseline .github/dev-eval-baseline.json --json
      - name: Run mutation batteries (守卫到底有没有牙)
        # 上面那道门只问"能力在不在"，这一道问"守着能力的测试会不会根本没在守"：
        # 逐条把源码改坏，确认有测试或门禁因此变红。--no-live = 不启真浏览器，
        # 只有现场能验的变异记成「本环境未验证」而不是"抓住"。
        run: python tests/mutation/run_all.py --no-live -q
      - name: Run retrieval regression gate
        run: python -m agent_runtime.retrieval_eval --dataset .github/retrieval-eval.json --baseline .github/retrieval-eval-baseline.json --minimum 0.75 --json
      - name: Run offline game workflow acceptance
        run: python -m unittest tests.test_game_workflow_e2e tests.test_retrieval_adapter tests.test_retrieval_api -q

  # 改动行覆盖率门（2026-11-17 随 sqlite 分片拆成独立 job）：门要看到**全部**
  # 分片的覆盖率才有意义——任何一片单独的数据都会把「别的片覆盖过的改动行」误判成
  # 未覆盖。所以 4 片各自上传带片号的数据，这里收齐、combine、再过门。
  # needs 聚合语义：任一 test 分片红则本 job 不跑（CI 已经红，门不再叠噪）。
  coverage-gate:
    name: changed-line coverage gate
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        # 门要 `git diff <base>..HEAD`，浅克隆取不到 base 会 fail-closed 恒红。
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Download all shard coverage data
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ci-cov-shard-*
          merge-multiple: true
          path: .tmp/ci-cov
      - name: Changed-line coverage gate (改动行覆盖率门)
        # 门盯的是「这次改的行有没有任何用例走过」，不是全仓百分比。
        # 实测依据：同一份覆盖率报告里全仓 15.4%（12.4 万条语句的分母），而改动行覆盖率
        # 95.1% —— 前者涨跌都回答不了本次改动，后者能。门槛与 fail-closed 三条都在
        # `agent_runtime/coverage_eval.py`，守卫 tests/test_coverage_eval.py。
        run: |
          set +e
          BASE="${{ github.event.before }}"
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=$(git rev-parse HEAD^);; esac
          mkdir -p .tmp/ci-cov-combined
          python -m coverage combine --data-file=.tmp/ci-cov-combined/.coverage .tmp/ci-cov
          # `--omit "*:TOOLS"` 排掉的是 `tests/test_tool_taxonomy.py` 里那个**合成文件名**：
          # 它 exec 一段从 tools.py 切出来的字面量时给的 filename 是 `tools.py:TOOLS`，
          # coverage 把它记进数据文件，报告阶段就去 open 它 —— 于是每次跑都有一条
          # `CoverageWarning: Couldn't parse ...`（run 41401092750 实测）。路径里带冒号的
          # 键不可能是真文件，所以这条 omit 只排合成条目：本地对拍过两份报告，
          # 690 个文件、125116 条语句一字不差。守卫在 tests/test_coverage_eval.py。
          python -m coverage json --ignore-errors --omit "*:TOOLS" --data-file=.tmp/ci-cov-combined/.coverage -o .tmp/ci-cov/report.json
          python -m agent_runtime.coverage_eval --report .tmp/ci-cov/report.json --base "$BASE"
          rc=$?
          # 门自己也要能被验出牙：把报告路径改坏时它必须红，而不是"没数据=通过"。
          if [ "$rc" != "0" ]; then echo "改动行覆盖率门判红（exit=$rc）"; fi
          exit $rc

  # 浏览器回归门：六套 browser.mjs 全部进 CI（2026-11-17 挂门，同日 memoryLayers
  # 完成口径无关化改造后纳入）。此前它们硬编码 msedge + 手工跑，UI 契约漂移
  # （侧栏标签化、状态徽标隐藏、摘要措辞）没人发现——门不挂上去就永远靠人记得。
  # memoryLayers 的像素断言已改为口径无关（DOM↔API 标记/边/注入环对账、
  # 采样有效性），不再依赖有机真实数据；跨层亮度排序属配色设计涌现结果，
  # 浅色默认重构后已退役该断言（套件头注释载明）。
  browser-regression:
    name: browser regression (chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCMIND_MEMORY_V2: "1"
      DOCMIND_TRACE: "1"
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      NO_PROXY: localhost,127.0.0.1
      PLAYWRIGHT_CHANNEL: chrome
      PLAYWRIGHT_NO_SANDBOX: "1"
      DOCMIND_BASE: http://127.0.0.1:8000
      DOCMIND_UI_TEST_URL: http://127.0.0.1:8000
      DOCMIND_UI_FIXTURE_URL: http://127.0.0.1:5174/tests/ask-message.fixture.html
      DOCMIND_LAYER_SESSION: web-cibrowser01
      DOCMIND_HOOK_SESSION: web-cibrowser01
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build frontend and install playwright-core
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          npm install --no-save playwright-core
      - name: Start backend with isolated state and fixture project
        env:
          # runner 上下文不能出现在 job 级 env（GitHub 解析期拒收，整条 workflow
          # 零 jobs 失败）；只在用它的步骤里给。
          DOCMIND_STATE_ROOT: ${{ runner.temp }}/docmind-ci-state
        run: |
          mkdir -p "$RUNNER_TEMP/ci-fixture/src"
          printf 'def add(a, b):\n    return a + b\n' > "$RUNNER_TEMP/ci-fixture/src/calc.py"
          nohup python -m uvicorn api:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health
          printf '{"root":"%s/ci-fixture","name":"CI browser fixture"}' "$RUNNER_TEMP" > "$RUNNER_TEMP/proj.json"
          pid=$(curl -sf -X POST http://127.0.0.1:8000/api/projects -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/proj.json" | python -c 'import json,sys; print(json.load(sys.stdin)["project_id"])')
          python tools/ci_browser_seed.py "$pid"
      - name: Start vite dev for ask fixture page
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5174 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5174/tests/ask-message.fixture.html > /dev/null; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:5174/tests/ask-message.fixture.html
      - name: Run browser regression suites
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/frontend/node_modules/playwright-core
        run: |
          for s in product-ui right-rail ask-conversation memoryFunnel diskRetention memoryLayers; do
            echo "== $s"
            node "frontend/tests/$s.browser.mjs"
          done
      - name: Show server logs on failure
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/server.log" || true
          tail -30 "$RUNNER_TEMP/vite.log" || true

  # 常开真实网络验收（2026-11-17）：runner 出口干净，不再依赖 opt-in vars。
  # 重试 3 次指数退避；搜索类遇封禁/验证码墙记可见 skip，抓取类（example.com）
  # 不允许豁免。本地校园网出口被墙，用例在本地可见 skip（DOCMIND_REAL_NETWORK=1 强跑）。
  real-network:
    name: real network acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real network lane
        run: python -m pytest tests/test_real_network_lane.py -q -p no:cacheprovider
